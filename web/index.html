<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xml2cli</title>
  <link rel="stylesheet" href="/static/style.css?v=18" />
</head>
<body>
  <header class="header">
    <h1>xml2cli</h1>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-header">
        <div class="mode-switch">
          <label><input type="radio" name="mode" value="xml2cli" checked /> XML → CLI</label>
          <label><input type="radio" name="mode" value="cli2xml" /> CLI → XML</label>
        </div>
        <div class="input-tabs">
          <button type="button" class="btn btn-primary tab active" data-tab="paste">粘贴</button>
          <button type="button" class="btn btn-tab tab" data-tab="upload">上传</button>
        </div>
      </div>

      <div class="options-bar">
        <label class="option">
          <span class="option-label">板卡</span>
          <select id="board-select" class="select-input">
            <option value="">自动检测</option>
          </select>
        </label>
        <label class="option option-checkbox">
          <input type="checkbox" id="yang-tree-all" />
          <span>完整 YANG 树 (_all)</span>
        </label>
      </div>

      <div class="content-area">
        <div id="paste-panel" class="editor-panel">
          <textarea id="input-text" placeholder="粘贴 XML 或 CLI 命令..."></textarea>
        </div>

        <div id="upload-panel" class="editor-panel hidden">
          <div class="drop-zone" id="drop-zone">
            <p>拖拽文件到此处，或点击选择</p>
            <input type="file" id="file-input" />
          </div>
        </div>
      </div>

      <div class="panel-footer">
        <div class="panel-actions">
          <button type="button" id="convert-btn" class="btn btn-primary">转换</button>
          <button type="button" id="clear-btn" class="btn btn-tab">清除</button>
        </div>
        <p id="error" class="error hidden"></p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="output-title">
          <h2>输出</h2>
          <p id="board-info" class="board-info hidden"></p>
        </div>
        <div class="actions">
          <button type="button" id="copy-btn" class="btn btn-primary">复制</button>
          <button type="button" id="download-btn" class="btn btn-tab">下载</button>
        </div>
      </div>

      <div class="options-bar deploy-bar">
        <label class="option">
          <span class="option-label">设备地址</span>
          <input type="text" id="device-host" class="text-input host-input" placeholder="IP" />
        </label>
        <label class="option">
          <span class="option-label">板卡</span>
          <select id="deploy-board-select" class="select-input deploy-board-select" title="选择板卡后自动关联 NETCONF 端口"></select>
        </label>
        <label class="option">
          <span class="option-label">用户名</span>
          <input type="text" id="device-user" class="text-input user-input" autocomplete="username" />
        </label>
        <label class="option option-password">
          <span class="option-label">密码</span>
          <span class="password-field">
            <input type="password" id="device-password" class="text-input password-input" autocomplete="current-password" />
            <button
              type="button"
              id="device-password-toggle"
              class="password-toggle"
              aria-label="显示密码"
              title="显示密码"
            >
              <svg class="icon-eye-open" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
                />
              </svg>
              <svg class="icon-eye-closed hidden" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 6.5a5.5 5.5 0 0 1 5.45 4.68l1.46 1.46A11.94 11.94 0 0 0 23 12c-1.73 3.89-6 7-11 7a11.8 11.8 0 0 0-4.95-1.1l1.55 1.55A5.5 5.5 0 0 1 12 17.5c-3.04 0-5.5-2.46-5.5-5.5S8.96 6.5 12 6.5zm-8.27 2.1L2.7 4.77 4.11 3.36l16.5 16.5-1.41 1.41-2.2-2.2C17.1 19.7 14.7 20.5 12 20.5c-5 0-9.27-3.11-11-7a12.1 12.1 0 0 1 3.18-4.32z"
                />
              </svg>
            </button>
          </span>
        </label>
        <button type="button" id="clear-device-btn" class="btn btn-tab clear-device-btn">清除</button>
      </div>

      <div class="content-area">
        <div class="editor-panel">
          <textarea id="output-text" readonly placeholder="转换结果将显示在这里..."></textarea>
        </div>
      </div>

      <div class="panel-footer">
        <div class="panel-actions">
          <button type="button" id="deploy-btn" class="btn btn-primary">配置下发</button>
        </div>
        <p id="deploy-status" class="deploy-status hidden"></p>
      </div>
    </section>
  </main>

  <script src="/static/app.js?v=18"></script>
</body>
</html>
