[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xml2cli"
version = "0.1.0"
description = "Bidirectional NETCONF XML and CLI converter for Nokia devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "ncclient>=0.6.15",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
xml2cli = "xml2cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xml2cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
